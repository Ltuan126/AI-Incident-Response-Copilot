global:
  resolve_timeout: 1m

route:
  receiver: incident-copilot
  group_by: [alertname, service_name, alert_type]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h

receivers:
  - name: incident-copilot
    webhook_configs:
      - url: http://api:8000/api/v1/integrations/alertmanager
        send_resolved: true
