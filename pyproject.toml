[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-response-copilot"
version = "0.1.0"
description = "Evidence-grounded, human-approved AI copilot for production incident response"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "prometheus-client>=0.21",
    "structlog>=24.4",
    "httpx>=0.28",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.setuptools]
packages = [
    "apps",
    "apps.api",
    "apps.api.app",
    "apps.api.app.api",
    "apps.api.app.api.v1",
    "apps.api.app.core",
    "apps.api.app.models",
    "apps.api.app.schemas",
    "apps.api.app.services",
    "apps.worker",
    "apps.worker.agent",
    "apps.worker.agent.nodes",
    "apps.worker.agent.policies",
    "packages",
    "packages.connectors",
    "packages.evaluation",
    "packages.evaluation.scorers",
    "packages.shared",
    "packages.shared.logging",
    "packages.shared.schemas",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["apps/api/tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/*" = ["S101"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
exclude = ["migrations/", "apps/web/"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*"]
ignore_missing_imports = true
