name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy apps packages

      - name: Tests
        run: pytest

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t incident-copilot-api:ci .

      - name: Build demo service image
        run: docker build -f infra/docker/demo.Dockerfile -t demo-checkout-service:ci .

  compose:
    name: Smoke test the stack
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build api demo-checkout-service postgres redis \
            prometheus alertmanager traffic-generator

      - name: Wait for the API to become ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "API never became healthy"
          docker compose logs api
          exit 1

      - name: Apply migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Drive the deployment-regression scenario
        run: |
          curl -fsS -X POST http://localhost:8000/api/v1/simulator/incidents/deployment-regression
          for _ in $(seq 1 40); do
            if curl -fsS "http://localhost:8000/api/v1/incidents?service_name=checkout-api" \
              | grep -q '"total":1'; then exit 0; fi
            sleep 3
          done
          echo "Prometheus/Alertmanager did not create an incident"
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
