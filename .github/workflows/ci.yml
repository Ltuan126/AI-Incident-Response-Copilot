name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy apps packages

      - name: Tests
        run: pytest

  postgres:
    name: PostgreSQL integration and migrations
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copilot_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot_test -d copilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://copilot_test:ci_only_password@localhost:5432/copilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests against isolated PostgreSQL schemas
        run: pytest

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f infra/docker/api.Dockerfile -t incident-copilot-api:ci .

      - name: Build demo service image
        run: docker build -f infra/docker/demo.Dockerfile -t demo-checkout-service:ci .

  compose:
    name: Smoke test the stack
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --build api demo-checkout-service postgres redis \
            prometheus alertmanager traffic-generator

      - name: Wait for the API to become ready
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then exit 0; fi
            sleep 3
          done
          echo "API never became healthy"
          docker compose logs api
          exit 1

      - name: Apply migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Check migrated schema matches the models
        run: docker compose exec -T api alembic check

      - name: Drive the deployment-regression scenario
        run: |
          curl -fsS -X POST http://localhost:8000/api/v1/simulator/incidents/deployment-regression
          for _ in $(seq 1 40); do
            if curl -fsS "http://localhost:8000/api/v1/incidents?service_name=checkout-api" \
              | grep -q '"total":1'; then exit 0; fi
            sleep 3
          done
          echo "Prometheus/Alertmanager did not create an incident"
          exit 1

      - name: Collect evidence from all configured sources
        run: |
          incident_id=$(curl -fsS "http://localhost:8000/api/v1/incidents?service_name=checkout-api" \
            | python -c 'import json, sys; print(json.load(sys.stdin)["items"][0]["id"])')
          curl -fsS -X POST \
            "http://localhost:8000/api/v1/incidents/${incident_id}/collect-evidence" \
            -H 'Content-Type: application/json' -d '{}' \
            | tee /tmp/collection.json
          grep -q '"agent_run_id"' /tmp/collection.json
          grep -q '"source_type":"metric"' /tmp/collection.json
          grep -q '"source_type":"log"' /tmp/collection.json
          grep -q '"source_type":"deployment"' /tmp/collection.json

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
